<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나란히 - 오늘의 이동</title>
  <!-- CSS는 프론트엔드2가 작성 -->
  <link rel="stylesheet" href="../static/css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- ===== 상단: 로고 ===== -->
  <header class="header">
    <a href="home.html" class="logo">
      <img src="../static/img/logo-leaf.svg" alt="">
      <span>나란히</span>
    </a>
  </header>

  <!-- ===== 본문 ===== -->
  <main class="home">

    <!-- 1. 제목 구역 -->
    <section class="home-intro">
      <!-- 프로필 수정 링크 (앞의 < 화살표는 CSS로) -->
      <a href="profile.html" class="profile-edit-link">이동 프로필 수정하기</a>
      <h1>어디로 갈까요?</h1>
      <p class="profile-status">
        <img src="../static/img/icon-check.svg" alt="">
        <span>나의 이동 프로필 적용 중</span>
      </p>
    </section>

    <!-- 2. 길찾기 입력 + 버튼 (ROUTE-01, 동작은 프론트엔드2가 JS로) -->
    <form class="route-form">

      <!-- 출발지 -->
      <div class="input-box">
        <label for="start">출발지</label>
        <input type="text" id="start" name="start" placeholder="출발지를 입력해주세요">
      </div>

      <!-- 목적지 -->
      <div class="input-box">
        <label for="end">목적지</label>
        <input type="text" id="end" name="end" placeholder="목적지를 입력해주세요">
      </div>

      <!-- 오늘의 특별한 상황 (분홍 박스) -->
      <section class="today">
        <h2>오늘 이동에 특별한 상황이 있나요?</h2>
        <p class="today-desc">필요한 날에만 한마디 더해주세요.</p>

        <div class="input-box">
          <label for="today-status">오늘의 이동 상태 (선택)</label>
          <textarea id="today-status" name="text" maxlength="500"
            placeholder="예: 캐리어가 있어요 / 다리를 다쳤어요 / 유모차를 끌고 있어요"></textarea>
        </div>

        <!-- 입력 완료: 문장 분석 요청 (PARSE-01, 동작은 프론트엔드2가 JS로) -->
        <button type="button" class="btn-ai">입력 완료</button>

        <!-- 문장 분석 에러 문구 자리 (평소엔 숨김, JS가 보여줌) -->
        <p class="error-message" role="alert" hidden></p>

        <p class="note">오늘 입력한 내용은 이번 경로에만 반영해요.</p>
      </section>

      <p class="note">입력하지 않으면 저장된 이동 프로필이 자동 적용됩니다.</p>

      <!-- 길찾기 에러 문구 자리 (평소엔 숨김, JS가 보여줌) -->
      <p class="error-message" role="alert" hidden></p>

      <button type="submit" class="btn-primary">나에게 편한 길 찾기</button>

    </form>

  </main>

    <!-- ===== 03. 오늘의 이동 상태 해석 확인 (아래에서 올라오는 창) =====
       '입력 완료' → PARSE-01 응답이 오면 JS가 내용을 채우고 열어요 (프론트엔드2) -->
  <dialog class="parse-sheet" aria-labelledby="parse-title">
    <h2 id="parse-title">오늘의 이동 상태를<br>이렇게 반영할게요</h2>

    <!-- 인식된 상태 (분홍 박스) -->
    <div class="parse-status">
      <p class="parse-status-label">오늘의 이동 상태</p>
      <!-- 예시 문구: JS가 today 결과(suitcase/stroller/injuredLeg)로 바꿔 넣음 -->
      <p class="parse-status-value">캐리어가 있어요</p>
    </div>

    <!-- 경로에 반영되는 내용 (예시: JS가 결과에 맞게 채움, ✓ 표시는 CSS로) -->
    <ul class="parse-effects">
      <li>계단 회피 강화</li>
      <li>급경사 회피 강화</li>
      <li>우회 허용</li>
    </ul>

    <!-- 인식 한계 안내 (PARSE-01 warnings, 없으면 숨김) -->
    <p class="parse-warning" role="alert" hidden></p>

    <p class="note">이번 경로에만 적용되며, 저장된 프로필은 유지돼요.</p>

    <!-- 누르면 창이 닫히고 결과가 적용됨 -->
    <form method="post" action="result.html">
      <button type="submit" class="btn-primary" value="apply">이 조건으로 적용하기</button>
    </form>
  </dialog>
<script src="../static/js/script.js"></script>
</body>
</html>
